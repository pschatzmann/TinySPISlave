sentence=Header-only SPI slave library with one API for ESP32, STM32, RP2040 and RP2350.
paragraph=Stream based API (available/read/write) plus an optional per-frame callback. Uses the ESP-IDF spi_slave driver on ESP32, the PL022 slave mode on RP2040/RP2350 and the SPI peripheral mode of the STM32duino core on STM32.
